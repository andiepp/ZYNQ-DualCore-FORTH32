<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23476b"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#23476b;stroke-width:1.2}
      .ps{fill:#eef3f9;stroke:#1f5f99;stroke-width:1.6}
      .pl{fill:#f3f8ef;stroke:#3d7a2a;stroke-width:1.6}
      .cpu{fill:#fff4e0;stroke:#b36b00;stroke-width:1.4}
      .bus{fill:#e8eef6;stroke:#23476b;stroke-width:1.4}
      .both{fill:#fbeef6;stroke:#9b3b78;stroke-width:1.4}
      .t{font-weight:600;font-size:13px}
      .s{font-size:11px;fill:#333}
      .h{font-weight:700;font-size:14px}
      .ln{stroke:#23476b;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="900" height="640" fill="#fff"/>

  <!-- PC -->
  <rect class="box" x="10" y="40" width="130" height="132" rx="6"/>
  <text class="t" x="75" y="62" text-anchor="middle">Windows PC</text>
  <text class="s" x="75" y="84" text-anchor="middle">ZynqDualForth32 app</text>
  <text class="s" x="75" y="100" text-anchor="middle">(both cores, protocol 3)</text>
  <text class="s" x="75" y="116" text-anchor="middle">or a terminal program</text>
  <text class="s" x="75" y="132" text-anchor="middle">(core 0) or the HASE host</text>
  <text class="s" x="75" y="156" text-anchor="middle">115200 Bd, 8N1</text>
  <path class="ln" d="M140,100 L182,100" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="161" y="92" text-anchor="middle">USB</text>

  <!-- PS -->
  <rect class="ps" x="185" y="20" width="200" height="600" rx="8"/>
  <text class="h" x="285" y="42" text-anchor="middle" fill="#1f5f99">PS: processing system</text>
  <rect class="box" x="200" y="60" width="170" height="36" rx="4"/>
  <text class="t" x="285" y="83" text-anchor="middle">UART0 (FTDI channel B)</text>
  <rect class="box" x="200" y="110" width="170" height="246" rx="4"/>
  <text class="t" x="285" y="130" text-anchor="middle">Cortex-A9 core 0</text>
  <text class="s" x="285" y="146" text-anchor="middle">bare metal, sw/src/main.c</text>
  <text class="s" x="212" y="170">• kernel loader + verify,</text>
  <text class="s" x="222" y="184">for each HF32 core</text>
  <text class="s" x="212" y="201">• byte pump UART ↔ FIFOs</text>
  <text class="s" x="212" y="218">• per core: 64 KB input ring,</text>
  <text class="s" x="222" y="232">4 KB output ring</text>
  <text class="s" x="212" y="249">• input n · mux, core markers</text>
  <text class="s" x="212" y="266">• service requests (SOH),</text>
  <text class="s" x="222" y="280">per core: status 1, …</text>
  <text class="s" x="212" y="297">• HASE MCNF node (core 0)</text>
  <text class="s" x="212" y="314">• saved sources, autostart</text>
  <text class="s" x="212" y="331">• dictionary / stack reads</text>
  <text class="s" x="222" y="345">(the core paused)</text>
  <path class="ln" d="M285,96 L285,108" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="box" x="200" y="370" width="170" height="68" rx="4"/>
  <text class="t" x="285" y="390" text-anchor="middle">QSPI flash (16 MB)</text>
  <text class="s" x="285" y="407" text-anchor="middle">BOOT.bin at 0; saved sources</text>
  <text class="s" x="285" y="421" text-anchor="middle">core 0 0xFE0000, core 1 0xFD0000</text>
  <text class="s" x="285" y="434" text-anchor="middle">(magic HF32)</text>
  <rect class="box" x="200" y="450" width="170" height="40" rx="4"/>
  <text class="t" x="285" y="467" text-anchor="middle">DDR3 (512 MB)</text>
  <text class="s" x="285" y="482" text-anchor="middle">ARM program, rings</text>
  <rect class="box" x="200" y="502" width="170" height="52" rx="4"/>
  <text class="t" x="285" y="520" text-anchor="middle">Fabric clocks</text>
  <text class="s" x="285" y="536" text-anchor="middle">FCLK0 50 MHz (cores, AXI)</text>
  <text class="s" x="285" y="549" text-anchor="middle">FCLK1 200 MHz (patgen, DDS)</text>
  <rect class="box" x="200" y="566" width="170" height="40" rx="4"/>
  <text class="t" x="285" y="583" text-anchor="middle">M_AXI_GP0</text>
  <text class="s" x="285" y="598" text-anchor="middle">0x43C00000, 4 KB</text>

  <!-- AXI link -->
  <path class="ln" d="M370,586 L398,586 L398,92 L418,92" marker-end="url(#a)"/>
  <text class="s" x="404" y="340" transform="rotate(-90 404 340)" text-anchor="middle">AXI-Lite</text>

  <!-- PL -->
  <rect class="pl" x="415" y="20" width="335" height="600" rx="8"/>
  <text class="h" x="582" y="42" text-anchor="middle" fill="#3d7a2a">PL: forth_system.v</text>
  <rect class="box" x="425" y="56" width="315" height="56" rx="4"/>
  <text class="t" x="582" y="74" text-anchor="middle">AXI-Lite slave</text>
  <text class="s" x="582" y="90" text-anchor="middle">per core (0x00.., 0x40..): loader · hold/pause · RX/TX bridge</text>
  <text class="s" x="582" y="104" text-anchor="middle">board state · XADC · patgen · pin functions · cores, mailboxes</text>

  <!-- the two cores -->
  <rect class="cpu" x="425" y="124" width="152" height="132" rx="4"/>
  <text class="t" x="501" y="142" text-anchor="middle">core 0 (hf32_node.v)</text>
  <text class="s" x="501" y="160" text-anchor="middle">HF32 CPU (hf32_cpu.v)</text>
  <text class="s" x="501" y="174" text-anchor="middle">data/return/float stacks</text>
  <text class="s" x="501" y="190" text-anchor="middle">multi-cycle unit (hf32_mcu.v):</text>
  <text class="s" x="501" y="204" text-anchor="middle">multiply, divide, FPU</text>
  <text class="s" x="501" y="222" text-anchor="middle">128 KB RAM (32 block RAMs)</text>
  <text class="s" x="501" y="238" text-anchor="middle">terminal RX/TX FIFOs</text>
  <rect class="cpu" x="588" y="124" width="152" height="132" rx="4"/>
  <text class="t" x="664" y="142" text-anchor="middle">core 1 (hf32_node.v)</text>
  <text class="s" x="664" y="160" text-anchor="middle">HF32 CPU (hf32_cpu.v)</text>
  <text class="s" x="664" y="174" text-anchor="middle">data/return/float stacks</text>
  <text class="s" x="664" y="190" text-anchor="middle">multi-cycle unit (hf32_mcu.v):</text>
  <text class="s" x="664" y="204" text-anchor="middle">multiply, divide, FPU</text>
  <text class="s" x="664" y="222" text-anchor="middle">128 KB RAM (32 block RAMs)</text>
  <text class="s" x="664" y="238" text-anchor="middle">terminal RX/TX FIFOs</text>
  <path class="ln" d="M501,112 L501,122" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M664,112 L664,122" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- the I/O bus -->
  <rect class="bus" x="425" y="270" width="315" height="40" rx="4"/>
  <text class="t" x="582" y="287" text-anchor="middle">I/O bus: request registers + arbiter</text>
  <text class="s" x="582" y="302" text-anchor="middle">one request per clock; the cores take turns</text>
  <path class="ln" d="M501,256 L501,268" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M664,256 L664,268" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- for the two cores -->
  <rect class="both" x="425" y="324" width="315" height="58" rx="4"/>
  <text class="t" x="582" y="341" text-anchor="middle">between the cores</text>
  <text class="s" x="582" y="357" text-anchor="middle">mailbox 32 cells each way · 8 locks · 4 KB shared RAM</text>
  <text class="s" x="582" y="372" text-anchor="middle">owner core of each pin and peripheral · core number</text>
  <path class="ln" d="M582,310 L582,322" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- shared I/O -->
  <rect class="box" x="425" y="396" width="315" height="214" rx="4"/>
  <text class="t" x="582" y="414" text-anchor="middle">I/O registers from $100000, shared</text>
  <text class="s" x="437" y="436">• LEDs, RGB, buttons, switches</text>
  <text class="s" x="437" y="453">• ms and µs timers</text>
  <text class="s" x="437" y="470">• 42 shield pins in 3 ports + pin router</text>
  <text class="s" x="437" y="487">• PWM × 4 (pwm.v)</text>
  <text class="s" x="437" y="504">• UART × 2 (uart.v), SPI master × 2 (spi.v)</text>
  <text class="s" x="437" y="521">• I²C master (i2c.v)</text>
  <text class="s" x="437" y="538">• DDS, 200 MHz (dds.v)</text>
  <text class="s" x="437" y="555">• tone generator (tone.v)</text>
  <text class="s" x="437" y="572">• XADC scanner (xadc_scan.v)</text>
  <text class="s" x="437" y="589">• pattern generator, 200 MHz (patgen.v)</text>
  <path class="ln" d="M582,382 L582,394" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Board -->
  <rect class="box" x="770" y="40" width="120" height="560" rx="6"/>
  <text class="t" x="830" y="62" text-anchor="middle">Arty Z7-20</text>
  <text class="s" x="830" y="100" text-anchor="middle">LD0–LD3, LD4/LD5</text>
  <text class="s" x="830" y="116" text-anchor="middle">BTN0–3, SW0–1</text>
  <text class="s" x="830" y="172" text-anchor="middle">shield IO0–IO13,</text>
  <text class="s" x="830" y="188" text-anchor="middle">IO26–IO41, A0–A5</text>
  <text class="s" x="830" y="204" text-anchor="middle">SCL, SDA</text>
  <text class="s" x="830" y="240" text-anchor="middle">SPI header</text>
  <text class="s" x="830" y="256" text-anchor="middle">MISO MOSI SCK SS</text>
  <text class="s" x="830" y="310" text-anchor="middle">analog A0–A11</text>
  <text class="s" x="830" y="370" text-anchor="middle">audio jack</text>
  <text class="s" x="830" y="386" text-anchor="middle">(low-pass, amp)</text>
  <text class="s" x="830" y="450" text-anchor="middle">Pmod JA, JB</text>
  <text class="s" x="830" y="466" text-anchor="middle">(16 channels)</text>
  <text class="s" x="830" y="540" text-anchor="middle">JP4: JTAG / QSPI</text>
  <text class="s" x="830" y="556" text-anchor="middle">boot mode</text>
  <path class="ln" d="M740,470 L768,470" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M740,589 L752,589 L752,458 L768,458" marker-end="url(#a)"/>
  <path class="ln" d="M740,555 L760,555 L760,380 L768,380" marker-end="url(#a)"/>
</svg>
